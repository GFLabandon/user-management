# Explicit deployment profile; no demonstration fallback or implicit local paths.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.thymeleaf.cache=true
app.demo=false
app.upload-dir=${UPLOAD_DIR:}
app.bootstrap.username=${APP_BOOTSTRAP_USERNAME:}
app.bootstrap.password=${APP_BOOTSTRAP_PASSWORD:}
server.address=${SERVER_ADDRESS:127.0.0.1}
# Enable only behind an HTTPS entry point; local HTTP verification uses false.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.forward-headers-strategy=none
spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
