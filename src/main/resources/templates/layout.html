<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="高校辅导员信息管理系统：辅导员档案管理原型">
    <title th:text="${title + ' · 高校辅导员信息管理系统'}">高校辅导员信息管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header" th:fragment="header">
    <div class="nav-shell">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">C</span>
            <span>
                <strong>高校辅导员信息管理系统</strong>
                <small>Campus Counselor Management</small>
            </span>
        </a>
        <nav sec:authorize="isAuthenticated()" aria-label="主导航">
            <a th:href="@{/counselors}">辅导员档案</a>
            <a th:href="@{/departments}">院系管理</a>
            <a sec:authorize="hasRole('ADMIN')" class="button button-primary button-small" th:href="${listContext != null} ? @{${listContext.createUrl}} : @{/counselors/new}">新增档案</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/accounts}">账号管理</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/audit}">操作记录</a>
            <span sec:authentication="name"></span>
            <form class="logout-form" th:action="@{/logout}" method="post">
                <button class="button button-ghost button-small" type="submit">退出登录</button>
            </form>
        </nav>
    </div>
</header>

<footer class="site-footer" th:fragment="footer">
    <p>高校辅导员信息管理系统 · 开发原型</p>
</footer>
</body>
</html>
