<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="高校辅导员信息管理系统：人员资料管理原型">
    <title th:text="${title + ' · 高校辅导员信息管理系统'}">高校辅导员信息管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header" th:fragment="header">
    <div class="nav-shell">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">C</span>
            <span>
                <strong>高校辅导员信息管理系统</strong>
                <small>Campus Counselor Management</small>
            </span>
        </a>
        <nav th:if="${session.user != null}" aria-label="主导航">
            <a th:href="@{/users/list}">人员目录</a>
            <a class="button button-primary button-small" th:href="@{/users/add}">新增资料</a>
            <form class="logout-form" th:action="@{/logout}" method="post">
                <button class="button button-ghost button-small" type="submit">退出登录</button>
            </form>
        </nav>
    </div>
</header>

<footer class="site-footer" th:fragment="footer">
    <p>高校辅导员信息管理系统 · 开发原型</p>
</footer>
</body>
</html>
