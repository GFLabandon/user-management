<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='账号管理')}"></head>
<body><header th:replace="~{layout :: header}"></header><main class="page-shell">
<section class="page-heading"><div><p class="eyebrow">访问权限</p><h1>账号管理</h1><p class="muted">登录账号独立于档案；只读账号可查看档案和院系。</p></div><a class="button button-primary" th:href="@{/accounts/new}">新增账号</a></section>
<p class="alert" th:if="${success}" th:text="${success}"></p><div class="card table-scroll"><table><thead><tr><th>登录名</th><th>权限</th><th>账号状态</th><th>关联档案编号</th><th>操作</th></tr></thead><tbody><tr th:each="a : ${accounts}"><td th:text="${a.username}"></td><td th:text="${a.role.label}"></td><td th:text="${a.enabled ? '启用' : '停用'}"></td><td th:text="${a.counselorId ?: '未关联'}"></td><td><a th:href="@{/accounts/{id}/edit(id=${a.id})}">编辑账号</a></td></tr></tbody></table></div></main><footer th:replace="~{layout :: footer}"></footer></body></html>
