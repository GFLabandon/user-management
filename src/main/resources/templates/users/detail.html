<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='资料详情')}"></head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="page-shell profile-page">
    <a class="back-link" th:href="@{/users/list}">← 返回人员目录</a>

    <section class="card profile-card">
        <div class="profile-hero">
            <img class="avatar avatar-large" th:if="${user.photoPath}" th:src="${user.photoPath}" alt="">
            <span class="avatar avatar-fallback avatar-large" th:unless="${user.photoPath}"
                  th:text="${#strings.substring(user.username, 0, 1)}">A</span>
            <div>
                <p class="eyebrow" th:text="${'资料编号 #' + user.id}">资料编号 #1</p>
                <h1 th:text="${user.username}">Alex Chen</h1>
                <p class="muted" th:text="${user.note}">Backend engineer</p>
            </div>
            <a class="button button-primary profile-edit" th:href="@{/users/edit/{id}(id=${user.id})}">编辑资料</a>
        </div>

        <dl class="detail-grid">
            <div>
                <dt>部门</dt>
                <dd th:text="${user.department != null ? user.department.name : '未分配'}">Engineering</dd>
            </div>
            <div>
                <dt>资料角色</dt>
                <dd>
                    <span class="tag" th:each="role : ${user.roles}" th:text="${role.name}">Editor</span>
                    <span th:if="${user.roles.isEmpty()}">未分配角色</span>
                </dd>
            </div>
            <div>
                <dt>头像</dt>
                <dd th:text="${user.photoPath != null ? '已上传' : '未上传'}">未上传</dd>
            </div>
        </dl>
    </section>
</main>

<div th:replace="~{layout :: footer}"></div>
</body>
</html>
