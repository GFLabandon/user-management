<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='编辑资料')}"></head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="page-shell form-page">
    <a class="back-link" th:href="@{/users/list}">← 返回人员目录</a>
    <section class="page-heading compact">
        <div>
            <p class="eyebrow">资料维护</p>
            <h1>编辑人员资料</h1>
            <p class="muted">更新人员资料、部门归属和资料角色。</p>
        </div>
    </section>

    <form class="card profile-form" th:action="@{/users/edit}" th:object="${user}"
          method="post" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}">
        <div class="alert alert-error" role="alert" th:if="${error}" th:text="${error}"></div>

        <div class="form-grid">
            <label class="field field-wide" for="username">
                <span>姓名</span>
                <small>当前版本姓名不可重复。</small>
                <input id="username" type="text" th:field="*{username}" required>
                <small class="field-error" th:errors="*{username}"></small>
            </label>

            <label class="field field-wide" for="note">
                <span>备注</span>
                <textarea id="note" th:field="*{note}" rows="3" required></textarea>
                <small class="field-error" th:errors="*{note}"></small>
            </label>

            <label class="field" for="deptId">
                <span>部门</span>
                <select id="deptId" th:field="*{deptId}" required>
                    <option value="">请选择部门</option>
                    <option th:each="department : ${departments}" th:value="${department.id}"
                            th:text="${department.name}"></option>
                </select>
                <small class="field-error" th:errors="*{deptId}"></small>
            </label>

            <label class="field" for="photo">
                <span>更换头像</span>
                <input id="photo" type="file" name="photo" accept="image/png,image/jpeg">
                <small th:if="${user.photoPath}">不选择文件则保留当前头像。</small>
                <small th:unless="${user.photoPath}">支持 PNG 或 JPG，最大 5 MB。</small>
            </label>

            <fieldset class="field field-wide">
                <legend>资料角色</legend>
                <small>用于资料分类，不授予登录账号的操作权限。</small>
                <div class="checkbox-grid">
                    <label class="check-card" th:each="role : ${availableRoles}">
                        <input type="checkbox" th:field="*{roleIds}" th:value="${role.id}">
                        <span th:text="${role.name}">Editor</span>
                    </label>
                </div>
            </fieldset>
        </div>

        <div class="form-actions">
            <a class="button button-ghost" th:href="@{/users/list}">取消</a>
            <button class="button button-primary" type="submit">保存修改</button>
        </div>
    </form>
</main>

<div th:replace="~{layout :: footer}"></div>
</body>
</html>
