<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='人员目录')}"></head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="page-shell">
    <section class="page-heading">
        <div>
            <p class="eyebrow">资料管理</p>
            <h1>人员目录</h1>
            <p class="muted">维护人员资料、部门归属和资料角色。</p>
        </div>
        <a class="button button-primary" th:href="@{/users/add}">新增资料</a>
    </section>

    <div class="alert alert-success" role="status" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error" role="alert" th:if="${error}" th:text="${error}"></div>

    <section class="card directory-card">
        <div class="directory-toolbar">
            <form class="search-form" th:action="@{/users/list}" method="get">
                <label class="sr-only" for="keyword">检索人员资料</label>
                <input id="keyword" type="search" name="keyword" th:value="${keyword}"
                       placeholder="按姓名或备注搜索">
                <button class="button button-secondary" type="submit">搜索</button>
                <a class="button button-ghost" th:if="${!#strings.isEmpty(keyword)}" th:href="@{/users/list}">清空</a>
            </form>
            <span class="count-pill" th:text="${userCount + ' 条资料'}">3 条资料</span>
        </div>

        <div class="table-scroll" th:if="${!users.isEmpty()}">
            <table>
                <thead>
                <tr>
                    <th>人员</th>
                    <th>部门</th>
                    <th>资料角色</th>
                    <th>备注</th>
                    <th class="actions-heading">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td>
                        <div class="person-cell">
                            <img class="avatar" th:if="${user.photoPath}" th:src="${user.photoPath}" alt="">
                            <span class="avatar avatar-fallback" th:unless="${user.photoPath}"
                                  th:text="${#strings.substring(user.username, 0, 1)}">A</span>
                            <div>
                                <strong th:text="${user.username}">Alex Chen</strong>
                                <small th:text="${'ID #' + user.id}">ID #1</small>
                            </div>
                        </div>
                    </td>
                    <td th:text="${user.department != null ? user.department.name : '—'}">Engineering</td>
                    <td>
                        <div class="tag-list" th:if="${!user.roles.isEmpty()}">
                            <span class="tag" th:each="role : ${user.roles}" th:text="${role.name}">Editor</span>
                        </div>
                        <span class="muted" th:if="${user.roles.isEmpty()}">未分配角色</span>
                    </td>
                    <td class="note-cell" th:text="${user.note}">Backend engineer</td>
                    <td>
                        <div class="row-actions">
                            <a th:href="@{/users/detail/{id}(id=${user.id})}">详情</a>
                            <a th:href="@{/users/edit/{id}(id=${user.id})}">编辑</a>
                            <form th:action="@{/users/delete/{id}(id=${user.id})}" method="post"
                                  onsubmit="return confirm('确认删除这条人员资料？');">
                                <button class="text-button danger" type="submit">删除</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-state" th:if="${users.isEmpty()}">
            <span class="empty-icon">⌕</span>
            <h2>没有匹配的人员资料</h2>
            <p>请更换关键词，或新增人员资料。</p>
        </div>
    </section>
</main>

<div th:replace="~{layout :: footer}"></div>
</body>
</html>
