<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head(title='院系管理')}"></head>
<body><div th:replace="~{layout :: header}"></div>
<main class="page-shell"><section class="page-heading"><div><p class="eyebrow">组织信息</p><h1>院系管理</h1><p class="muted">被档案引用的院系可停用，不能直接删除。</p></div><a sec:authorize="hasRole('ADMIN')" class="button button-primary" th:href="@{/departments/new}">新增院系</a></section>
<div class="alert alert-success" role="status" th:if="${success}" th:text="${success}"></div>
<div class="alert alert-error" role="alert" th:if="${error}">
<p th:text="${error}"></p>
<p th:if="${deleteFailedId != null}">本次删除未完成，下方已显示最新院系列表。请核对后再操作；如需停用，请<a th:href="@{/departments/{id}/edit(id=${deleteFailedId})}">编辑该院系</a>。<a th:href="@{/departments}">重新加载列表</a></p>
<small th:if="${requestId != null}">请求编号：<span th:text="${requestId}"></span></small>
</div>
<section class="card table-scroll" tabindex="0" role="region" aria-label="院系列表，窄屏可左右滚动"><table><thead><tr><th>院系</th><th>状态</th><th>操作</th></tr></thead><tbody>
<tr th:each="d : ${departments}"><td th:text="${d.name}"></td><td th:text="${d.active ? '启用' : '停用'}"></td><td><div class="row-actions"><a sec:authorize="hasRole('ADMIN')" th:href="@{/departments/{id}/edit(id=${d.id})}">编辑</a><a sec:authorize="hasRole('ADMIN')" th:href="@{/audit(targetType='DEPARTMENT',targetId=${d.id})}">查看操作记录</a><form sec:authorize="hasRole('ADMIN')" th:action="@{/departments/{id}/delete(id=${d.id})}" method="post" onsubmit="return confirm('确认删除这个未被引用的院系？');"><input type="hidden" name="version" th:value="${d.version}"><button class="text-button danger" type="submit">删除</button></form></div></td></tr>
</tbody></table><p class="record-note" th:if="${departments.isEmpty()}">尚无院系。<span sec:authorize="hasRole('ADMIN')">请先新增院系再建立档案。</span><span sec:authorize="hasRole('VIEWER')">请联系管理员维护院系资料。</span></p></section></main><div th:replace="~{layout :: footer}"></div></body></html>
