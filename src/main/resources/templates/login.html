<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head(title='登录')}"></head>
<body class="login-page">
<div class="login-shell">
    <section class="login-intro">
        <a class="brand brand-light" th:href="@{/}">
            <span class="brand-mark">C</span>
            <span><strong>高校辅导员信息管理系统</strong><small>Campus Counselor Management</small></span>
        </a>
        <div>
            <p class="eyebrow">辅导员档案管理</p>
            <h1>辅导员档案，集中维护。</h1>
            <p class="login-copy">支持工号检索、院系筛选、任职状态维护和头像上传。</p>
        </div>
        <p class="stack-line">高校辅导员信息管理系统 · 开发原型</p>
    </section>

    <main class="login-panel">
        <form class="card login-card" th:action="@{/login}" method="post">
            <div>
                <p class="eyebrow">欢迎使用</p>
                <h2>登录管理端</h2>
                <p class="muted">使用管理员分配的账号登录。</p>
            </div>

            <div class="alert alert-error" role="alert" th:if="${param.error}">账号或密码错误，或账号已停用。</div>
            <p class="alert" th:if="${param.expired}">登录已过期或账号信息已变更，请重新登录。密码重置后请使用新密码；账号停用时请联系管理员。</p>

            <label class="field">
                <span>登录账号</span>
                <input name="username" type="text" autocomplete="username" required autofocus>
            </label>
            <label class="field">
                <span>密码</span>
                <input name="password" type="password"  autocomplete="current-password" required>
            </label>
            <button class="button button-primary button-block" type="submit">登录</button>

            <p class="demo-note" th:if="${demo}">本地演示：管理员 admin / demo-admin-pass；只读 viewer / demo-viewer-pass</p>
        </form>
    </main>
</div>
</body>
</html>
