<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='登录')}"></head>
<body class="login-page">
<div class="login-shell">
    <section class="login-intro">
        <a class="brand brand-light" th:href="@{/}">
            <span class="brand-mark">C</span>
            <span><strong>高校辅导员信息管理系统</strong><small>Campus Counselor Management</small></span>
        </a>
        <div>
            <p class="eyebrow">辅导员档案管理</p>
            <h1>辅导员档案，集中维护。</h1>
            <p class="login-copy">支持工号检索、院系筛选、任职状态维护和头像上传。</p>
        </div>
        <p class="stack-line">高校辅导员信息管理系统 · 开发原型</p>
    </section>

    <main class="login-panel">
        <form class="card login-card" th:action="@{/login}" method="post">
            <div>
                <p class="eyebrow">欢迎使用</p>
                <h2>登录管理端</h2>
                <p class="muted">使用本地演示账号登录。</p>
            </div>

            <div class="alert alert-error" role="alert" th:if="${error}" th:text="${error}"></div>

            <label class="field">
                <span>登录账号</span>
                <input name="username" type="text" value="admin" autocomplete="username" required autofocus>
            </label>
            <label class="field">
                <span>密码</span>
                <input name="password" type="password" placeholder="demo-pass" autocomplete="current-password" required>
            </label>
            <button class="button button-primary button-block" type="submit">登录</button>

            <p class="demo-note"><strong>默认演示账号：</strong> admin / demo-pass</p>
        </form>
    </main>
</div>
</body>
</html>
