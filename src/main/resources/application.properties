spring.application.name=campus-counselor-management
spring.profiles.default=demo
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:mem:counselor;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

mybatis.configuration.map-underscore-to-camel-case=true
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
# Drain a bounded rejected upload so requests just above 20 MB still receive the 413 page.
# This does not raise either multipart acceptance limit; larger bodies may close the connection.
server.tomcat.max-swallow-size=21MB

app.upload-dir=${UPLOAD_DIR:./uploads}
app.bootstrap.username=${APP_BOOTSTRAP_USERNAME:}
app.bootstrap.password=${APP_BOOTSTRAP_PASSWORD:}
logging.level.io.github.gflabandon.counselor=INFO

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Probes use the same HTTP server as business requests; expose no component details.
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
logging.pattern.level=%5p [requestId=%X{requestId:-}]
