name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Java and maintenance safety
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress verify
      - run: python3 -B -m unittest discover -s scripts/tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-reports
          path: target/surefire-reports/TEST-*.xml
          retention-days: 7

  mysql:
    name: MySQL runtime, migrations and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Record Docker and Compose versions
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version
      - name: Build tested application and migration harness
        run: |
          docker build -t campus-counselor-mysql:8.4.11-runtime-1 docker/mysql
          docker build -t campus-counselor-management:local .
          docker build --target migration-verification -t campus-counselor-migrations:local .
      - name: Run isolated MySQL acceptance
        run: python3 -B scripts/verify-mysql-ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql-acceptance
          # Allowlist summaries only: never upload env files, SQL backups or avatar archives.
          path: |
            target/mysql-ci-summary.json
            target/compose-verification/*/result.json
            target/migration-verification/*/result.json
            target/recovery-verification/*/result.json
          retention-days: 7

  security:
    name: Dependency and runtime image vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build -t campus-counselor-mysql:8.4.11-runtime-1 docker/mysql
          docker build -t campus-counselor-management:local .
      - name: Install pinned scanner with checksum verification
        run: python3 -B scripts/install-trivy.py
      - name: Scan Java dependencies, application OS and MySQL image
        run: python3 -B scripts/check-security.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-reports
          path: target/security/*.json
          retention-days: 7
